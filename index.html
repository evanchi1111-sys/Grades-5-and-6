<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>刷題小勇者</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 海圖風：深海色橫帶＋海圖紙底；按鈕與卡片是有粗外框的貼紙，影子是實心的。科目各有一個顏色（--sc）。 */
:root{
  --bg:#E4F0EA; --paper:#FBFEFC; --surface:#FBFEFC; --ink:#0A2B3D; --muted:#4D6A78; --line:#BFD6CD; --edge:#0A2B3D;
  --sea:#0A2B3D; --sea-2:#123F57; --sea-ink:#EAF6F1; --sea-line:#2D6A82;
  --blue:#0E8F8F; --blue-edge:#0A2B3D; --blue-ink:#FFFFFF; --pick:#CDEFE8;
  --sun:#FFC83D; --sun-edge:#0A2B3D; --sun-ink:#2B1F00;
  --good:#17835A; --good-bg:#D5F2E3; --bad:#C23B38; --bad-bg:#FBE0DD;
  --heat:#E8643A; --cool:#2FA6D8;
  --chi:#E0572F; --mat:#2F62E6; --soc:#D99A00; --nat:#12997A;
  --c0:#2F62E6; --c1:#C27A00; --c2:#0E8F8F; --c3:#B83B7A;
  --sc:var(--blue);
  --f-display:'LXGW WenKai TC','Chiron GoRound TC','PingFang TC','Microsoft JhengHei',serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071C29; --paper:#0F2D40; --surface:#0F2D40; --ink:#E6F3EE; --muted:#9BB6BF; --line:#24495C; --edge:#02121B;
    --sea:#04131D; --sea-2:#0B2A3B; --sea-ink:#E6F3EE; --sea-line:#2D6A82;
    --blue:#35C4C0; --blue-edge:#02121B; --blue-ink:#032123; --pick:#17485A;
    --sun:#FFCB4D; --sun-edge:#02121B; --sun-ink:#2B1F00;
    --good:#4FD39A; --good-bg:#0F3A2B; --bad:#FF8A82; --bad-bg:#46201F;
    --heat:#FF7A55; --cool:#58B4F5;
    --chi:#FF8A63; --mat:#7C9EFF; --soc:#F2B93B; --nat:#47D1AE;
    --c0:#7C9EFF; --c1:#F0A04B; --c2:#47D1AE; --c3:#EE79B1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071C29; --paper:#0F2D40; --surface:#0F2D40; --ink:#E6F3EE; --muted:#9BB6BF; --line:#24495C; --edge:#02121B;
  --sea:#04131D; --sea-2:#0B2A3B; --sea-ink:#E6F3EE; --sea-line:#2D6A82;
  --blue:#35C4C0; --blue-edge:#02121B; --blue-ink:#032123; --pick:#17485A;
  --sun:#FFCB4D; --sun-edge:#02121B; --sun-ink:#2B1F00;
  --good:#4FD39A; --good-bg:#0F3A2B; --bad:#FF8A82; --bad-bg:#46201F;
  --heat:#FF7A55; --cool:#58B4F5;
  --chi:#FF8A63; --mat:#7C9EFF; --soc:#F2B93B; --nat:#47D1AE;
  --c0:#7C9EFF; --c1:#F0A04B; --c2:#47D1AE; --c3:#EE79B1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--f-body);margin:0;
  background-image:repeating-radial-gradient(circle at 85% -10%,transparent 0 46px,color-mix(in srgb,var(--line) 55%,transparent) 46px 47px);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
.shell{max-width:720px;margin:0 auto;padding-block:14px 36px;min-width:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3;font-weight:700}
.num{font-variant-numeric:tabular-nums}
[data-sub="國語"]{--sc:var(--chi)}[data-sub="數學"]{--sc:var(--mat)}[data-sub="社會"]{--sc:var(--soc)}[data-sub="自然"]{--sc:var(--nat)}

/* buttons: sticker with solid offset shadow */
.btn{border:2px solid var(--edge);background:var(--paper);color:var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--edge);padding:10px 18px;min-height:50px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s;position:relative;top:0}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--edge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--blue);color:var(--blue-ink)}
.btn-sun{background:var(--sun);color:var(--sun-ink)}
.btn-wide{width:100%}
.btn-sm{min-height:40px;padding:4px 12px;font-size:15px;box-shadow:0 3px 0 var(--edge)}

/* home */
.hero{position:relative;overflow:hidden;border-radius:18px;background:var(--sea);color:var(--sea-ink);border:2px solid var(--edge);box-shadow:0 5px 0 var(--edge);padding:20px 18px 18px;margin-top:6px;--line:var(--sea-line);--muted:#9FC4CF}
.iso{position:absolute;right:-30px;top:-20px;width:84%;max-width:440px;pointer-events:none;opacity:.8}
.hero-row{position:relative;display:flex;gap:14px;align-items:center}
.mascot{width:92px;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.hero h1{font-size:clamp(30px,8vw,42px);letter-spacing:.04em;color:#fff}
.hero p{margin:2px 0 0;color:var(--muted);font-size:15px}
.rank{position:relative;margin-top:18px;display:grid;gap:8px}
.rank-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rank-title{font-family:var(--f-display);font-weight:700;font-size:18px}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden;border:2px solid var(--edge)}
.hero .bar{background:var(--sea-2);border-color:var(--sea-line)}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s;background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(10,43,61,.28) 10px 12px)}
.bar.blue>i{background-color:var(--sc)}
.units{display:grid;gap:18px;margin-top:20px}
.subj{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.tpk>summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}.tpk[open]>summary{margin-bottom:6px}
.subjbtn{font-family:var(--f-display);font-size:20px;padding-inline:8px}
.subjbtn[aria-pressed="true"]{background:var(--sc,var(--blue));color:#fff;transform:translateY(2px);box-shadow:0 2px 0 var(--edge)}
.subj[aria-label="選擇年級"] .subjbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ucard{background:var(--paper);border:2px solid var(--edge);border-radius:14px;box-shadow:0 5px 0 var(--edge);padding:16px 16px 18px 22px;display:grid;gap:12px;position:relative;overflow:hidden}
.ucard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--sc);border-right:2px solid var(--edge)}
.ucard h2{font-size:23px}
.ulabel{font-size:14px;color:var(--sc);font-weight:700;filter:brightness(.82)}
.ucard .btn-primary{background:var(--sc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 14px;min-height:40px;font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--pick);border-color:var(--edge);color:var(--ink);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;color:var(--muted);font-size:14px;flex-wrap:wrap}

/* play */
.top{display:flex;align-items:center;gap:10px}
.top .bar{flex:1}
.hearts{display:flex;gap:2px}
.heart{width:28px;height:28px}
.thermo{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}
.t-track{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden;position:relative;border:2px solid var(--edge)}
.t-track i{display:block;height:100%;background:linear-gradient(90deg,var(--cool),var(--heat));transition:width .35s}
.t-val{min-width:58px;text-align:right;color:var(--ink);font-weight:700}
.t-lbl{white-space:nowrap}
.qcard{background:var(--paper);border:2px solid var(--edge);border-radius:14px;box-shadow:0 5px 0 var(--edge);padding:18px 16px;margin-top:16px;display:grid;gap:14px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.tag{border-radius:99px;padding:1px 10px;background:var(--bg);border:1.5px solid var(--line)}
.tag.hard{background:var(--sun);color:var(--sun-ink);border-color:var(--edge)}
.qtext{font-family:var(--f-display);font-size:21px;font-weight:700;margin:0;line-height:1.6}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;font-size:15px;width:100%}
th,td{border:1.5px solid var(--edge);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--bg)}
.opts{display:grid;gap:12px}
.opt{text-align:left;border:2px solid var(--edge);border-radius:12px;box-shadow:0 4px 0 var(--edge);background:var(--paper);padding:12px 14px;min-height:54px;font-weight:500;display:flex;gap:10px;align-items:center}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--edge)}
.opt.ok{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default}
.tfrow{grid-template-columns:1fr 1fr}
.tfrow .opt{justify-content:center;font-size:21px;font-weight:700;min-height:68px}
.sentence{font-size:20px;line-height:2.4}
.slot{display:inline-block;min-width:76px;min-height:42px;border:2px dashed var(--muted);border-radius:10px;padding:0 10px;margin:0 4px;vertical-align:middle;line-height:38px;text-align:center;background:var(--bg)}
.slot.on{border-style:solid;border-color:var(--edge);background:var(--pick)}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.slot.no{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.bank{display:flex;flex-wrap:wrap;gap:12px}
.piece{border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);background:var(--paper);border-radius:10px;padding:6px 14px;min-height:46px;font-weight:700;text-align:left}
.piece:active{transform:translateY(3px);box-shadow:none}
.piece:disabled{opacity:.3}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:12px;align-content:start}
.mi{border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);background:var(--paper);border-radius:10px;padding:10px;min-height:56px;font-size:16px;font-weight:500;text-align:left}
.mi.sel{background:var(--pick)}
.mi.c0{border-color:var(--c0);box-shadow:0 3px 0 var(--c0);background:color-mix(in srgb,var(--c0) 16%,var(--paper))}
.mi.c1{border-color:var(--c1);box-shadow:0 3px 0 var(--c1);background:color-mix(in srgb,var(--c1) 16%,var(--paper))}
.mi.c2{border-color:var(--c2);box-shadow:0 3px 0 var(--c2);background:color-mix(in srgb,var(--c2) 16%,var(--paper))}
.mi.c3{border-color:var(--c3);box-shadow:0 3px 0 var(--c3);background:color-mix(in srgb,var(--c3) 16%,var(--paper))}
.mi.ok{outline:3px solid var(--good)}
.mi.no{outline:3px solid var(--bad)}
.hint{font-size:14px;color:var(--muted);margin:0}
.ans-line{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed var(--muted);border-radius:12px;align-items:center;counter-reset:n}
.ans-line .piece{position:relative;padding-left:38px;background:var(--pick)}
.ans-line .piece::before{counter-increment:n;content:counter(n);position:absolute;left:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px;line-height:22px;text-align:center}
.ans-line.ok{border-color:var(--good)}
.ans-line.no{border-color:var(--bad)}
.srow{display:grid;gap:8px;padding:10px;border:2px solid var(--line);border-radius:12px}
.srow.ok{border-color:var(--good);background:var(--good-bg)}
.srow.no{border-color:var(--bad);background:var(--bad-bg)}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.sb{flex:1 1 90px;border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);background:var(--paper);border-radius:10px;padding:6px 10px;min-height:44px;font-weight:700}
.sb[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.fb{border-radius:14px;padding:14px 16px;margin-top:16px;border:2px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb-h{font-family:var(--f-display);font-weight:700;font-size:22px}
.fb.ok .fb-h{color:var(--good)} .fb.no .fb-h{color:var(--bad)}
.fb p{margin:6px 0 0}
.note{font-size:15.5px}
.note b{font-family:var(--f-display)}
.dock{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:10px;display:grid}
.dock:empty{display:none}
.boil{animation:boil .7s ease-out}
@keyframes boil{0%{transform:scale(1)}30%{transform:scale(1.05)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.97)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* result */
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0}
.star{width:56px;height:56px}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,8vw,42px);text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:12px 0}
.stat{background:var(--bg);border:2px solid var(--edge);border-radius:12px;padding:10px 6px}
.stat b{display:block;font-family:var(--f-display);font-size:26px}
.stat span{font-size:13px;color:var(--muted)}
.wlist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.wlist li{border:2px solid var(--edge);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:15.5px}
.wlist .a{color:var(--good);font-weight:700;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:20;max-width:88vw}
@media (max-width:420px){
  .mgrid{gap:8px} .mi{font-size:15px;padding:8px}
  .hero-row{align-items:flex-start}
  .mascot{width:72px}
}
</style>
</head><body>

<div id="app"></div>

<script>
(function(){

var KEY='sci6-quest-v1';
var UNITS={
  1:{subj:'自然',name:'熱的影響與傳播',short:'自然 第 1 單元',topics:['熱脹冷縮','粒子世界','熱的傳播','保溫與散熱']},

mc(1,0,2,'做液體熱脹冷縮實驗時，玻璃管要選擇較細的，原因是什麼？',['比較好看','水位的變化會更明顯','水比較不會溢出','瓶子比較不會破'],1,'同樣的體積變化，在較細的管子裡水位升降更大，更容易看清楚。');

tf(1,2,2,'輻射一定要靠固體、液體或氣體當介質才能傳熱。',false,'輻射不需要任何介質，所以太陽的熱可以穿過幾乎沒有物質的太空傳到地球。');
mc(1,2,3,'撐傘、躲在樹蔭下、穿上外套，這些做法都能涼快一點，共同的原理是什麼？',['增加熱傳導','阻擋部分太陽的輻射熱','增加空氣對流','讓身體產生冷空氣'],1,'它們都擋住了一部分太陽的輻射，所以比直接曬太陽涼快。');
mc(1,2,3,'在瓦斯爐上煮湯：鍋子把熱傳給湯，湯受熱後上下翻動。這兩個過程依序主要是哪兩種傳熱方式？',['傳導、對流','對流、傳導','輻射、對流','傳導、輻射'],0,'鍋子是固體，用傳導把熱傳給湯；湯是液體，靠對流把熱傳遍整鍋。');
order(1,2,3,'煮茶時，壺裡的水怎麼循環加熱？請依序排列：',['壺底的水先受熱','受熱的水變輕往上升','上方較冷的水往下沉','水不斷循環流動','整壺茶水都變熱了'],'這就是液體的對流。');
mc(1,2,3,'四根粗細相同的棒子（塑膠、木頭、鋁、紙），一端同時放進熱水，另一端塗上蠟。最先融化的最可能是哪一根？',['塑膠棒','木棒','鋁棒','紙棒'],2,'金屬的傳導比塑膠、木頭、紙都快，所以鋁棒另一端的蠟最先融化。');

mc(1,3,2,'保溫瓶的瓶蓋和真空層，主要是阻隔熱的哪兩種傳播？',['傳導和對流','對流和輻射','傳導和輻射','只有輻射'],0,'瓶蓋和真空層阻隔熱的傳導和對流；內層亮面則減少熱的輻射。');

sorting(1,3,2,'下列物品的主要功能是「保溫」還是「散熱」？',['保溫','散熱'],[['保溫瓶',0],['冰敷袋',1],['羽絨衣',0],['涼感衣物',1],['屋頂通風球',1],['冰淇淋桶的保麗龍外層',0],['竹製坐墊',1],['保溫桶',0]],'阻隔或減緩熱的傳播就能保溫；增加熱的傳播就能加快散熱。');
match(1,3,2,'連連看：散熱方法與原理',[['冰敷袋','藉由傳導，加快身體散熱'],['涼感衣物','加速汗水蒸發，帶走身體的熱'],['冷氣搭配電風扇','增加空氣流動，加快降溫'],['屋頂裝通風球','增加空氣對流，排出熱空氣']],'每一種散熱方法，都是在加快熱的傳播。');
mc(1,3,3,'想讓一碗熱湯盡快變涼，下列哪種做法最合理？',['倒進保麗龍碗並蓋上蓋子','倒進金屬碗並用電風扇吹','倒進保溫瓶','倒進陶瓷杯並用毛巾包住'],1,'金屬傳熱快，電風扇又加快空氣流動，兩種作用一起加速散熱。');
mc(1,3,2,'雙層屋頂在太陽能板和屋頂之間留出空隙，這層空隙能帶走熱氣，主要是靠什麼？',['對流','輻射','熱脹冷縮','傳導'],0,'中間的空隙形成隔熱的空氣層，並產生對流帶走熱氣。');
mc(1,3,2,'透水性鋪面能幫地面降溫，主要是因為什麼？',['水分滲透、蒸發會帶走地面的熱','鋪面會吸收更多太陽輻射','鋪面顏色變黑','增加熱傳導到空氣中'],0,'水分的滲透和蒸發能帶走地面上的熱，讓地面降溫。');
mc(1,3,3,'羽絨衣的夾層充滿空氣，主要的作用是什麼？',['減少熱的傳導和對流，形成保暖層','增加熱的輻射','讓身體自己產生熱','讓汗水快速蒸發'],0,'空氣不容易傳熱，夾層裡的空氣就像一層保暖的牆。');

mc(1,3,3,'小琪把三種杯子裝入 300 mL、90°C 的熱水，放在同一個房間，每 10 分鐘量一次水溫。30 分鐘後，哪一個杯子的保溫效果最好？',['金屬杯','陶瓷杯','保麗龍杯','三個一樣'],2,'保麗龍杯降溫最慢，30 分鐘後還有 73°C。金屬傳熱快，熱很快散失，所以降溫最快。',{h:['時間（分鐘）','0','10','20','30'],r:[['金屬杯（°C）','90','70','58','50'],['陶瓷杯（°C）','90','76','65','57'],['保麗龍杯（°C）','90','84','78','73']]});

/* 水與天氣 */
mc(2,0,1,'自然界中的水有哪三種形態？',['氣態、液態、固態','氣態、液態、膠態','液態、固態、粉態','只有液態和固態'],0,'水有氣態（水蒸氣）、液態（雨水、海洋）和固態（冰、雪、霜）三種形態。');
sorting(2,0,1,'把下列的水，分到正確的形態：',['氣態','液態','固態'],[['水蒸氣',0],['雨水',1],['冰雹',2],['海洋',1],['雪',2],['霜',2],['河流',1]],'水蒸氣是氣態；雨水、海洋、河流是液態；冰、雪、霜、冰雹是固態。');
mc(2,0,1,'雲是怎麼形成的？',['水蒸氣飄在高空，遇冷凝結成小水滴或小冰晶','地面的灰塵聚集在一起','海水直接飛上天空','冰塊融化後的水氣'],0,'空氣中的水蒸氣遇冷，凝結成小水滴或冰晶，飄在高空就形成雲。');

tf(2,0,1,'水蒸氣是眼睛看得到的白色煙霧。',false,'水蒸氣是氣態的水，看不見。我們看到的白煙其實是小水滴。');
mc(2,0,2,'從冰箱拿出來的冷飲，杯子外壁出現小水珠，這是什麼現象？',['杯子裡的水滲出來','空氣中的水蒸氣遇冷凝結成小水滴','冰塊融化了','杯子自己出水'],1,'空氣中的水蒸氣遇到冷的杯壁，凝結成小水滴。');
tf(2,0,2,'露是在溫度高於 0°C 時，水蒸氣遇冷凝結在物體表面形成的小水滴。',true,'形成露的溫度高於 0°C；溫度低於 0°C 時，就會形成霜。');
mc(2,0,2,'冬天清晨在高山的草葉上看到白霜，當時的氣溫最可能是多少？',['約 12°C','約 8°C','約 −2°C','約 20°C'],2,'溫度低於 0°C，水蒸氣才會在物體表面形成冰晶，也就是霜。');
match(2,0,2,'連連看：現象與名稱',[['飄在高空的小水滴或冰晶','雲'],['飄在地面附近的小水滴','霧'],['附著在葉片上的小水滴（高於 0°C）','露'],['附著在葉片上的白色冰晶（低於 0°C）','霜']],'雲、霧是飄在空中；露、霜是附著在物體表面，兩者以 0°C 為界。');
order(2,0,2,'水循環的順序是？',['海洋、河流的水蒸發成水蒸氣','水蒸氣升到高空遇冷，凝結成小水滴形成雲','雨、雪等降水落回地表','雨水匯集成河流，流回海洋'],'水在自然界不斷循環，產生不同的天氣變化。');
mc(2,0,2,'植物的葉片把水氣散發到空氣中，這個過程叫做什麼？',['蒸散','凝結','降水','滲入'],0,'植物體內的水，經由葉片以水蒸氣的形態散發到空氣中，叫做蒸散。');

fill(2,0,2,'當溫度低於{}°C，水蒸氣會在物體表面形成冰晶，稱為{}。',['0','霜','露','10'],['0','霜'],'低於 0°C 形成霜；高於 0°C 形成露。');
mc(2,0,3,'剛從冷凍庫拿出來的冰棒（約 −18°C），放在 25°C 的桌上，表面先出現一層白白的霜，過一會兒變成小水珠。最合理的解釋是什麼？',['表面溫度低於 0°C 時形成霜，後來升到 0°C 以上，水蒸氣改形成露','冰棒裡的冰自己長出來','冰棒裡的糖水滲出來','空氣中的灰塵變成了霜'],0,'溫度低於 0°C 形成霜，升到 0°C 以上就形成露（小水珠）。');
mc(2,0,3,'「露和霜形成的溫度條件」實驗中，C 組要在冰塊裡加食鹽，目的是什麼？',['讓溫度降到 0°C 以下','讓水變甜','讓冰塊變大','讓溫度計更準'],0,'冰塊加食鹽可以讓溫度低於 0°C，這樣杯壁才會出現霜。',{h:['組別','杯中物質','杯中溫度','杯子外壁'],r:[['A','常溫水','26°C','沒有變化'],['B','冰水','5°C','小水珠（露）'],['C','冰塊加食鹽','−6°C','白色的霜']]});
mc(2,0,2,'下雪時，雪落到地面仍是固態，是因為冰晶在下降途中怎麼樣？',['沒有融化','變成了水蒸氣','變成了雨','被風吹走了'],0,'冰晶在下降過程中沒有融化，到達地面時仍是固態，就是雪。');
tf(2,0,1,'自然界中的水只存在於海洋裡。',false,'水也存在於河流、湖泊、地下水、冰川，還有空氣中的水蒸氣。');

mc(2,1,3,'氣象人員預報天氣時，為什麼要同時參考衛星雲圖和地面天氣圖？',['兩種圖長得一樣','衛星雲圖看雲的分布與厚薄，天氣圖看氣壓、鋒面等天氣系統，合起來預測更準','衛星雲圖只能看海洋','天氣圖只能看陸地'],1,'雲的分布和天氣系統是兩種不同的資訊，要合在一起看，預測才準確。');

mc(2,2,2,'夏季臺灣主要受哪一種氣團影響？天氣有什麼特色？',['太平洋氣團，炎熱潮濕','大陸冷氣團，寒冷乾燥','太平洋氣團，寒冷乾燥','大陸冷氣團，炎熱潮濕'],0,'夏季主要受太平洋氣團影響，天氣炎熱潮濕。');
mc(2,2,2,'冬天臺灣常吹偏北風、氣溫較低，主要受哪種氣團影響？',['太平洋氣團','大陸冷氣團','颱風','暖鋒'],1,'冬季主要受來自大陸的冷氣團影響，天氣寒冷乾燥。');
match(2,2,2,'連連看：鋒面的符號與名稱',[['藍色三角形','冷鋒'],['紅色半圓形','暖鋒'],['紅色半圓加藍色三角形','滯留鋒']],'冷鋒用藍色三角形、暖鋒用紅色半圓，滯留鋒兩個符號朝相反方向。');
mc(2,2,2,'冷鋒過境時，常見的天氣變化是什麼？',['短暫陣雨，過後氣溫下降','長時間的綿綿細雨，過後氣溫上升','連續好幾天陰雨','天氣完全不變'],0,'冷鋒過境常有短暫的陣雨，過後氣溫會下降。');

mc(7,3,2,'「果汁機裡的刀刃一轉動起來時，我就彷彿又嗅到了童年水果的味道。」這句是哪一種關係？',['承接','轉折','遞進','條件'],0,'「一……就……」表示前一件事做完，立刻接著發生下一件事。');

sorting(7,3,3,'把這些課文句子，分到遞進、並列、承接三種關係裡：',['遞進','並列','承接'],[['珍珠奶茶不僅受到臺灣人喜愛，更風靡全球',0],['它不只是臺灣人的日常飲品，更讓世界見識到臺灣飲食文化的創新力量',0],['媽媽一邊熬煮，一邊調味',1],['讓他們一邊啜飲，一邊想像植物從泥土裡生成',1],['果汁機裡的刀刃一轉動起來，我就彷彿又嗅到了童年水果的味道',2]],'「不僅／不只……更……」是遞進；「一邊……一邊……」是並列；「一……就……」是承接。');
order(7,3,3,'請把詞語排成一個通順的句子：',['珍珠奶茶','不僅','受到臺灣人喜愛','更','風靡全球'],'「不僅……更……」連接前後兩個程度漸強的內容。');

order(6,2,2,'依課本「童詩創作」的方法，請排出創作的步驟：',['探索多元的靈感（從感官、典故、製作過程取材）','編排有序的句子','加入想像與創意，寫成詩句'],'課本的做法是先找靈感、再把句子有順序地排好，最後加入想像與創意。');
order(6,2,3,'以「鼎邊趖」為例，童詩發想的過程是什麼順序？',['事實：廚師把白色的在來米漿沿著熱鍋邊淋下','想像：米漿像穿著白色舞衣的溜冰選手在場上滑行','詩句：雪白的在來米漿，沿著滾熱的鼎邊，緩緩滑行'],'從「事實」出發，加上「想像」，就能寫出更生動的「詩句」。');
match(6,2,2,'連連看：用感官編排句子（以鼎邊趖為例）',[['看到','廚師將白色的在來米漿淋在鍋邊'],['摸到','熱熱的鍋子、小小的湯碗'],['聞到','豐富的食材香味四溢'],['聽到','食材下鍋時發出劈啪啪的聲響'],['感到','吃完給人幸福、溫暖的感覺']],'先寫具體的「看、摸、聞、聽」，再寫抽象的「感到」，句子就有順序。');

mc(23,2,2,'身為社會的一分子，追求個人便利與權益時，還要做到什麼？',['為他人著想並相互尊重','只顧自己','完全不管規範','只看別人怎麼做'],0,'課本：追求個人便利與權益時，也要為他人著想並相互尊重；並共同遵守社會規範，維護社會秩序。');

tf(23,3,1,'法律的目的，是保障人民的權益及維護社會的秩序。',true,'課本對法律的說明。');
sorting(23,3,2,'下列違法行為，通常會受到哪一種處罰？',['罰款','判刑坐牢'],[['製造噪音妨害他人安寧',0],['騎乘機車未戴安全帽',0],['竊盜',1],['吸毒',1],['縱火',1]],'課本：罰款的例子有製造噪音、騎機車未戴安全帽；判刑坐牢的例子有竊盜、吸毒及縱火。');
mc(23,3,2,'法律看起來限制人們的自由，真正的功能是什麼？',['保障每個人的權利不受他人侵犯','讓大家更難生活','讓政府有更多權力','只管小孩'],0,'課本：法律真正的功能是保障每個人的權利不受他人侵犯。');

fill(23,3,2,'商店不可以賣酒給未滿{}歲的人。',['十八','十二','十五','二十'],['十八'],'課本：商店不可賣酒給未滿十八歲的人，因為小朋友還在成長，喝酒會影響發育。');

mc(23,3,3,'「保護級」節目的規定是什麼？',['未滿六歲兒童不宜觀賞；六歲以上未滿十二歲需父母、師長或成年親友陪伴輔導觀賞','所有人都不能看','只有大人能看','一般觀眾皆可觀賞'],0,'課本：保護級（6）未滿六歲之兒童不宜觀賞，六歲以上未滿十二歲兒童需陪伴輔導觀賞。');

mc(23,3,3,'深夜喧譁、製造噪音妨害公眾安寧，依社會秩序維護法可處多少罰鍰？',['新臺幣六千元以下','新臺幣六百元以下','新臺幣六十萬元以下','新臺幣六億元以下'],0,'課本：社會秩序維護法第 72 條第三項：製造噪音或深夜喧譁，妨害公眾安寧者，可處新臺幣六千元以下罰鍰。');

mc(23,3,3,'網路上假的購物網站使消費者受騙損失財物，觸犯了哪一部法律？',['中華民國刑法','國家語言發展法','電視節目分級處理辦法','勞動基準法'],0,'課本：以虛設網路商店的方式使消費者受騙上當而損失財物，觸犯中華民國刑法。');

mc(24,0,1,'臺灣早期的居民多居住在西部的平原、盆地或台地，主要從事什麼？',['農業','伐木','晒鹽','登山'],0,'課本：早期多居住西部平坦的平原、盆地或台地，從事農業。');

match(24,1,1,'連連看：四周海岸的特色',[['西部海岸','許多沙灘、沙洲'],['北部海岸','地形曲折，有岬角與海灣'],['東部海岸','地勢陡峭、多斷崖絕壁'],['南部海岸','以珊瑚礁為主']],'課本對臺灣四周海岸特色的整理。');

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function lvlInfo(xp){var L=Math.floor(xp/XP_PER_LV)+1;return{L:L,into:xp%XP_PER_LV,title:TITLES[Math.min(L-1,TITLES.length-1)]}}
function unitStats(u){var n=0,d=0;BANK.forEach(function(q){if(q.u===u){n++;if(P.done[q.id])d++}});return{n:n,d:d}}
function wrongCount(){var c=0;BANK.forEach(function(q){if(P.wrong[q.id])c++});return c}
var TYPE_NAME={mc:'選擇題',tf:'是非題',fill:'填空題',match:'連連看',order:'排順序',sort:'分類題'};
var ac=null;
function tone(seq){if(!P.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var t=ac.currentTime;seq.forEach(function(n,i){var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=n;g.gain.setValueAtTime(0.0001,t+i*0.11);g.gain.exponentialRampToValueAtTime(0.12,t+i*0.11+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.11+0.16);o.connect(g);g.connect(ac.destination);o.start(t+i*0.11);o.stop(t+i*0.11+0.18)})}catch(e){}}
function toast(msg){var d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}

function tblHtml(t){if(!t)return'';return '<div class="tblwrap"><table><thead><tr>'+t.h.map(function(x){return'<th>'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+t.r.map(function(r){return'<tr>'+r.map(function(c,i){return(i===0?'<th>':'<td>')+esc(c)+(i===0?'</th>':'</td>')}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}

function ansHtml(q){
  if(q.type==='mc'||q.type==='tf')return esc(q.opts[q.a]);
  if(q.type==='fill'){var parts=q.q.split('{}');return parts.map(function(s,i){return esc(s)+(i<q.ans.length?'<b>【'+esc(q.ans[i])+'】</b>':'')}).join('')}
  if(q.type==='match')return q.pairs.map(function(p){return esc(p[0])+' → '+esc(p[1])}).join('<br>');
  if(q.type==='order')return q.items.map(function(x,i){return(i+1)+'. '+esc(x)}).join('<br>');
  if(q.type==='sort')return q.buckets.map(function(b,bi){return '<b>'+esc(b)+'</b>：'+q.items.filter(function(x){return x[1]===bi}).map(function(x){return esc(x[0])}).join('、')}).join('<br>');
  return''
}

/* ---------- round ---------- */
function startRound(opt){
  var pool=BANK.filter(function(q){return (opt.u===0||q.u===opt.u)&&(opt.t<0||opt.u===0||q.t===opt.t)&&(!opt.subj||UNITS[q.u].subj===opt.subj)});
  if(opt.wrong)pool=pool.filter(function(q){return P.wrong[q.id]});
  if(!pool.length){toast('這裡還沒有題目');return}
  var w=shuffle(pool.filter(function(q){return P.wrong[q.id]})),
      n=shuffle(pool.filter(function(q){return !P.wrong[q.id]&&!P.done[q.id]})),
      d=shuffle(pool.filter(function(q){return !P.wrong[q.id]&&P.done[q.id]}));
  var cand=w.slice(0,4).concat(n,w.slice(4),d),pick=[];
  while(pick.length<ROUND_N&&cand.length){
    var l1=pick.length?pick[pick.length-1].type:'',l2=pick.length>1?pick[pick.length-2].type:'',idx=-1;
    for(var i=0;i<cand.length;i++){if(!(cand[i].type===l1&&cand[i].type===l2)){idx=i;break}}
    if(idx<0)idx=0;
    pick.push(cand.splice(idx,1)[0]);
  }
  R={qs:pick,i:0,hearts:3,ok:0,xp:0,combo:0,boils:0,bad:[],locked:false,xp0:P.xp,opt:opt,leave:false};
  renderPlay();
}

function setDock(html,fn){var d=document.getElementById('dock');d.innerHTML=html;if(fn)fn(d)}

function mount(q){
  var body=document.getElementById('qbody');
  if(q.type==='mc'||q.type==='tf')return mountChoice(q,body);
  if(q.type==='fill')return mountFill(q,body);
  if(q.type==='match')return mountMatch(q,body);
  if(q.type==='order')return mountOrder(q,body);
  if(q.type==='sort')return mountSort(q,body);
}

function mountChoice(q,body){
  var idxs=q.opts.map(function(_,i){return i});if(q.type==='mc')idxs=shuffle(idxs);
  body.innerHTML='<div class="opts'+(q.type==='tf'?' tfrow':'')+'">'+idxs.map(function(i,n){return'<button class="opt" data-i="'+i+'">'+(q.type==='mc'?'<span class="num hint">'+'①②③④'[n]+'</span>':'')+'<span>'+esc(q.opts[i])+'</span></button>'}).join('')+'</div>';
  body.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
    if(R.locked)return;var i=+b.dataset.i,ok=i===q.a;
    body.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(+x.dataset.i===q.a)x.classList.add('ok')});
    if(!ok)b.classList.add('no');
    finish(q,ok);
  }});
}

function mountFill(q,body){
  var parts=q.q.split('{}'),n=parts.length-1,slots=[],chips=shuffle(q.chips.map(function(t,i){return{i:i,t:t}}));
  for(var i=0;i<n;i++)slots.push(null);
  function draw(state){
    var s='';for(var i=0;i<parts.length;i++){s+=esc(parts[i]);if(i<n){var v=slots[i]===null?'':chips.filter(function(c){return c.i===slots[i]})[0].t;s+='<button class="slot'+(v?' on':'')+(state?(state[i]?' ok':' no'):'')+'" data-s="'+i+'" aria-label="空格 '+(i+1)+'">'+esc(v)+'</button>'}}
    body.innerHTML='<div class="sentence">'+s+'</div><p class="hint">點下面的詞填入空格，點空格可以取消。</p><div class="bank">'+chips.map(function(c){return'<button class="piece" data-c="'+c.i+'"'+(slots.indexOf(c.i)>=0||R.locked?' disabled':'')+'>'+esc(c.t)+'</button>'}).join('')+'</div>';
    if(!R.locked){
      body.querySelectorAll('.piece').forEach(function(b){b.onclick=function(){var k=slots.indexOf(null);if(k<0)return;slots[k]=+b.dataset.c;draw();upd()}});
      body.querySelectorAll('.slot').forEach(function(b){b.onclick=function(){slots[+b.dataset.s]=null;draw();upd()}});
    }
  }
  function upd(){var c=document.getElementById('chk');if(c)c.disabled=slots.indexOf(null)>=0}
  draw();
  setDock('<button class="btn btn-primary" id="chk" disabled>確認答案</button>',function(){
    document.getElementById('chk').onclick=function(){
      var got=slots.map(function(s){return chips.filter(function(c){return c.i===s})[0].t}),st;
      if(q.any){var a=got.slice().sort().join('|'),b=q.ans.slice().sort().join('|');var okAll=a===b;st=got.map(function(){return okAll})}
      else st=got.map(function(g,i){return g===q.ans[i]});
      var ok=st.every(Boolean);R.locked=true;draw(st);finish(q,ok);
    };
  });
}

function mountMatch(q,body){
  var L=q.pairs.map(function(p,i){return{i:i,t:p[0]}}),Rr=shuffle(q.pairs.map(function(p,i){return{i:i,t:p[1]}}));
  var pair={},sel=null,done=false,res=null;
  function owner(r){for(var k in pair){if(pair[k]===r)return +k}return -1}
  function draw(){
    body.innerHTML='<p class="hint">先點左邊，再點右邊配成一對。點已配好的可以取消。</p><div class="mgrid"><div class="mcol">'
     +L.map(function(x){return'<button class="mi'+(sel===x.i?' sel':'')+((x.i in pair)?' c'+(x.i%4):'')+(res?(res[x.i]?' ok':' no'):'')+'" data-l="'+x.i+'"'+(done?' disabled':'')+'>'+esc(x.t)+'</button>'}).join('')
     +'</div><div class="mcol">'+Rr.map(function(x){var o=owner(x.i);return'<button class="mi'+(o>=0?' c'+(o%4):'')+(res&&o>=0?(res[o]?' ok':' no'):'')+'" data-r="'+x.i+'"'+(done?' disabled':'')+'>'+esc(x.t)+'</button>'}).join('')+'</div></div>';
    if(!done){
      body.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){var l=+b.dataset.l;if(l in pair){delete pair[l];sel=null}else sel=(sel===l?null:l);draw();upd()}});
      body.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){var r=+b.dataset.r,o=owner(r);if(sel===null){if(o>=0){delete pair[o];draw();upd()}return}if(o>=0)delete pair[o];pair[sel]=r;sel=null;draw();upd()}});
    }
  }
  function upd(){var c=document.getElementById('chk');if(c)c.disabled=Object.keys(pair).length<L.length}
  draw();
  setDock('<button class="btn btn-primary" id="chk" disabled>確認答案</button>',function(){
    document.getElementById('chk').onclick=function(){
      res={};var ok=true;L.forEach(function(x){res[x.i]=pair[x.i]===x.i;if(!res[x.i])ok=false});
      done=true;R.locked=true;draw();finish(q,ok);
    };
  });
}

function mountOrder(q,body){
  var items=q.items.map(function(t,i){return{i:i,t:t}}),bank=items,tries=0;
  do{bank=shuffle(items);tries++}while(q.items.length>1&&tries<8&&bank.every(function(x,i){return x.i===i}));
  var ans=[],res=null;
  function draw(){
    body.innerHTML='<p class="hint">依正確順序，一個一個點進下面的框。點框裡的可以拿回去。</p><div class="ans-line'+(res===null?'':(res?' ok':' no'))+'">'+(ans.length?'':'<span class="hint">從這裡開始排…</span>')+ans.map(function(x){return'<button class="piece" data-a="'+x.i+'"'+(R.locked?' disabled':'')+'>'+esc(x.t)+'</button>'}).join('')+'</div>'
     +'<div class="bank">'+bank.filter(function(x){return ans.indexOf(x)<0}).map(function(x){return'<button class="piece" data-b="'+x.i+'"'+(R.locked?' disabled':'')+'>'+esc(x.t)+'</button>'}).join('')+'</div>';
    if(!R.locked){
      body.querySelectorAll('[data-b]').forEach(function(b){b.onclick=function(){ans.push(items[+b.dataset.b]);draw();upd()}});
      body.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){ans=ans.filter(function(x){return x.i!==+b.dataset.a});draw();upd()}});
    }
  }
  function upd(){var c=document.getElementById('chk');if(c)c.disabled=ans.length<items.length}
  draw();
  setDock('<button class="btn btn-primary" id="chk" disabled>確認答案</button>',function(){
    document.getElementById('chk').onclick=function(){
      res=ans.every(function(x,i){return x.i===i});R.locked=true;draw();finish(q,res);
    };
  });
}

function mountSort(q,body){
  var pick=q.items.map(function(){return -1}),rows=shuffle(q.items.map(function(x,i){return i})),res=null;
  function draw(){
    body.innerHTML='<div class="mcol">'+rows.map(function(i){var it=q.items[i];
      return'<div class="srow'+(res?(res[i]?' ok':' no'):'')+'"><div>'+esc(it[0])+'</div><div class="sbtns">'+q.buckets.map(function(b,bi){return'<button class="sb" data-i="'+i+'" data-b="'+bi+'" aria-pressed="'+(pick[i]===bi)+'"'+(R.locked?' disabled':'')+'>'+esc(b)+'</button>'}).join('')+'</div></div>'}).join('')+'</div>';
    if(!R.locked)body.querySelectorAll('.sb').forEach(function(b){b.onclick=function(){pick[+b.dataset.i]=+b.dataset.b;draw();upd()}});
  }
  function upd(){var c=document.getElementById('chk');if(c)c.disabled=pick.indexOf(-1)>=0}
  draw();
  setDock('<button class="btn btn-primary" id="chk" disabled>確認答案</button>',function(){
    document.getElementById('chk').onclick=function(){
      res=q.items.map(function(it,i){return pick[i]===it[1]});var ok=res.every(Boolean);R.locked=true;draw();finish(q,ok);
    };
  });
}

/* ---------- grading ---------- */
function finish(q,ok){
  R.locked=true;
  var gain=0,boil=false;
  if(ok){
    gain=q.lv===3?15:q.lv===2?12:10;R.ok++;P.done[q.id]=1;delete P.wrong[q.id];R.combo++;
    if(R.combo>=5){boil=true;gain+=30;R.boils++;R.combo=0}
  }else{
    R.hearts--;P.wrong[q.id]=(P.wrong[q.id]||0)+1;R.combo=0;R.bad.push(q);
  }
  R.xp+=gain;P.xp+=gain;save();
  tone(ok?(boil?[523,659,784,1047]:[523,784]):[220,165]);
  hud();
  var showAns=!ok||q.type==='match'||q.type==='order'||q.type==='sort'||q.type==='fill';
  var fb=document.getElementById('fb');
  fb.innerHTML='<div class="fb '+(ok?'ok':'no')+(boil?' boil':'')+'" role="status"><div class="fb-h">'+(ok?(boil?'沸騰！連擊獎勵 +30 XP':'答對了！'):'再想想看')+(ok?'　+'+gain+' XP':'')+'</div>'
    +(ok?'':'<p><b>正確答案</b><br>'+ansHtml(q)+'</p>')
    +'<p class="note"><b>科學家筆記</b>　'+esc(q.e)+'</p></div>';
  var last=R.i>=R.qs.length-1||R.hearts<=0;
  setDock('<button class="btn btn-sun" id="next">'+(last?'看結果':'下一題')+'</button>',function(){
    document.getElementById('next').onclick=function(){if(last)renderResult();else{R.i++;renderPlay();window.scrollTo(0,0)}};
    var el=document.getElementById('next');try{el.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
  });
}

/* ---------- result ---------- */
function renderResult(){
  var total=R.qs.length,answered=R.i+1,out=R.hearts<=0&&answered<total;
  var stars=out?0:(R.ok>=9?3:R.ok>=7?2:R.ok>=5?1:0);
  P.rounds=(P.rounds||0)+1;save();
  var a=lvlInfo(R.xp0),b=lvlInfo(P.xp),up=b.L>a.L;
  var head=out?'能量用完了，休息一下再挑戰':(stars===3?'太厲害了！':stars>=1?'闖關成功！':'再練一回就會進步');
  var wl=R.bad.length?'<h3 style="margin-top:18px">這回合答錯的題目</h3><ul class="wlist">'+R.bad.map(function(q){return'<li>'+esc(q.q)+'<div class="a">'+ansHtml(q)+'</div></li>'}).join('')+'</ul>':'<p class="hint" style="text-align:center">這回合全部答對，沒有錯題。</p>';
  app.innerHTML='<div class="shell"><section class="qcard"><div class="stars">'+[0,1,2].map(function(i){return starSvg(i<stars)}).join('')+'</div>'
    +'<div class="big">'+head+'</div>'
    +'<div class="stats"><div class="stat"><b class="num">'+R.ok+' / '+answered+'</b><span>答對題數</span></div><div class="stat"><b class="num">+'+R.xp+'</b><span>獲得 XP</span></div><div class="stat"><b class="num">'+R.boils+'</b><span>沸騰次數</span></div></div>'
    +(up?'<p class="big" style="font-size:22px;color:var(--good)">升級了！Lv.'+b.L+'　'+esc(b.title)+'</p>':'<p class="hint" style="text-align:center">Lv.'+b.L+'　'+esc(b.title)+'　（'+b.into+' / '+XP_PER_LV+' XP）</p>')
    +wl+'</section><div class="row2"><button class="btn btn-primary" id="again">再玩一回</button><button class="btn" id="home">回首頁</button></div></div>';
  tone(stars>=2?[523,659,784,1047]:[523,659]);
  document.getElementById('again').onclick=function(){startRound(R.opt)};
  document.getElementById('home').onclick=renderHome;
  window.scrollTo(0,0);
}

mc(36,0,1,"下列哪一個詞語沒有錯別字？",["迫不急待", "迫不及待", "迫不及侍", "迫不急侍"],1,"「迫不及待」是急迫得不能再等待，「及」是來得及，「待」是等待。");
mc(36,0,1,"「畫蛇添足」這個成語的意思最接近下列哪一個？",["做事很小心", "多此一舉，反而壞事", "畫畫畫得很好", "行動非常迅速"],1,"畫蛇時多畫了腳，反而不像蛇，比喻做多餘的事，反而把事情弄糟。");
mc(36,0,1,"「謙虛」的相反詞是下列哪一個？",["誠實", "勤勞", "驕傲", "安靜"],2,"謙虛是不自滿；相反的是自滿、自以為了不起的「驕傲」。");
mc(36,1,1,"「春天來了，花兒笑彎了腰。」這句話使用了什麼修辭？",["譬喻", "擬人", "誇飾", "排比"],1,"花兒不會笑，卻寫成像人一樣「笑彎了腰」，是擬人修辭。");
mc(36,1,1,"「朋友就像一盞明燈，照亮我前進的路。」這句話使用了什麼修辭？",["譬喻", "設問", "映襯", "摹寫"],0,"用「像」把朋友比成明燈，是譬喻修辭（本體：朋友，喻詞：像，喻體：明燈）。");
mc(36,1,2,"「難道你不想成功嗎？」這句話使用了什麼修辭？",["譬喻", "擬人", "激問", "誇飾"],2,"句子心裡已有答案，卻用問句表達強烈的語氣，是設問中的激問。");
mc(36,1,2,"「＿＿天氣再冷，＿＿我們也要去運動。」最適合填入的關聯詞是？",["因為…所以", "即使…也", "不但…而且", "如果…就"],1,"「即使…也」表示就算有某種情況，結果也不會改變。");
mc(36,2,1,"在句子裡，用來表示書名的標點符號是哪一個？",["引號「」", "書名號《》", "刪節號……", "破折號——"],1,"《論語》《西遊記》這類書名要用書名號《》。");
mc(36,2,2,"小明每天清晨五點起床練習跑步，不管颳風下雨都沒有中斷，三年後他得到全縣的冠軍。最適合形容小明的成語是？",["一曝十寒", "持之以恆", "半途而廢", "見異思遷"],1,"持之以恆是長久堅持不放棄。其他三個都是做事不能堅持。");
mc(36,2,2,"「不積跬步，無以至千里」這句話想告訴我們什麼道理？",["走路要走得快", "一步一步地累積，才能成就遠大的事", "出門旅行要準備充足", "千里路途很遙遠，不要出門"],1,"「跬步」是半步。沒有一小步一小步的累積，就走不了千里，比喻努力要靠長期累積。");
mc(36,3,2,"「宜未雨而綢繆，毋臨渴而掘井。」告訴我們什麼道理？",["下雨天要記得帶雨傘", "凡事要事先準備，不要等事情發生了才著急", "口渴時要趕快找水喝", "挖井是很辛苦的工作"],1,"趁著沒下雨先修補好門窗，不要等到口渴才去挖井，比喻凡事要事先準備。");
fill(36,0,2,"「守株待兔」比喻不肯{}，只想靠{}得到成果。",["努力", "運氣", "改變", "勤勞"],["努力", "運氣"],"守株待兔出自一個農夫看到兔子撞到樹，就天天守在樹旁等兔子，比喻不肯努力、只想靠僥倖。");
fill(36,1,1,"「他跑得像風一樣快。」這句話使用的是{}修辭。",["譬喻", "擬人", "誇飾", "排比"],["譬喻"],"用「像」把「他」和「風」比較，是譬喻。");
fill(36,1,2,"「他餓得可以吞下一頭牛。」這句話使用的是{}修辭。",["誇飾", "譬喻", "擬人", "映襯"],["誇飾"],"故意把事情說得比實際誇張，是誇飾修辭。");
fill(36,2,1,"「蘋果、香蕉、芭樂」中間的「、」叫作{}，用在並列的詞語之間。",["頓號", "逗號", "句號", "分號"],["頓號"],"頓號用來分開並列的詞語。");
fill(36,3,2,"「一粥一飯，當思來處不易」提醒我們要{}食物；「宜未雨而綢繆」提醒我們凡事要事先{}。",["珍惜", "準備", "浪費", "忘記"],["珍惜", "準備"],"兩句都出自〈朱子治家格言〉：前者勸人惜福，後者勸人做好準備。");

/* ===== 第 37 單元：六年級數學 考古題題型 ===== */
tf(37,0,1,"1 既不是質數，也不是合數。",true,"質數要恰有 2 個因數，合數至少有 3 個因數；1 只有 1 個因數，所以兩者都不是。");
tf(37,0,1,"2 是質數，也是唯一的偶質數。",true,"2 只有 1 和 2 兩個因數，是質數；其他偶數都能被 2 整除，因數至少有 3 個，所以都是合數。");
tf(37,0,2,"12 和 35 互質。",true,"12 的因數有 1、2、3、4、6、12；35 的因數有 1、5、7、35。公因數只有 1，所以互質。");
tf(37,1,2,"一個不為 0 的數，除以小於 1 的數，商會比原來的數大。",true,"例如 6 ÷ 0.5 = 12，12 比 6 大。除數小於 1 時，商大於被除數。");
tf(37,2,2,"比 3：5 和比 9：20 是相等的比。",false,"3：5 的比值是 3/5，9：20 的比值是 9/20，兩者不相等。3：5 = 9：15。");
mc(37,0,1,"下列哪一個數是質數？",["51", "57", "59", "63"],2,"51 = 3×17，57 = 3×19，63 = 7×9，都是合數；59 只有 1 和 59 兩個因數，是質數。");
mc(37,0,1,"把 36 做質因數分解，下列哪一個寫法是正確的？",["2×2×3×3", "2×3×6", "4×9", "2×2×9"],0,"質因數分解要全部寫成質數相乘。6、4、9 都是合數，只有 2×2×3×3 全是質數。");
mc(37,0,1,"42 和 63 的最大公因數是多少？",["7", "21", "126", "14"],1,"42 = 2×3×7，63 = 3×3×7，共同的質因數是 3×7 = 21。");
mc(37,0,2,"8 和 12 的最小公倍數是多少？",["4", "48", "96", "24"],3,"8 和 12 的最大公因數是 4，最小公倍數 = 8×12÷4 = 24。");
mc(37,1,1,"4/5 ÷ 2 = ？",["8/5", "2/5", "4/7", "5/8"],1,"分數除以整數，等於分母乘以整數（或乘以倒數）：4/5 ÷ 2 = 4/10 = 2/5。");
mc(37,1,1,"3.6 ÷ 0.4 = ？",["0.9", "90", "9", "0.09"],2,"被除數和除數同時乘以 10，變成 36 ÷ 4 = 9。");
mc(37,1,2,"10 ÷ 3 的商，四捨五入取到小數第一位是多少？",["3.3", "3.4", "3.0", "3.33"],0,"10 ÷ 3 = 3.333…，看小數第二位是 3，捨去，所以約是 3.3。");
mc(37,2,1,"比 6：8 的比值是多少？",["4/3", "3/4", "2", "1/4"],1,"比值 = 前項 ÷ 後項 = 6 ÷ 8 = 3/4。");
mc(37,2,2,"把 0.6：0.9 化成最簡整數比，答案是？",["6：9", "3：2", "2：3", "1：3"],2,"前、後項同乘 10 得 6：9，再同除以 3 得 2：3。");
fill(37,0,1,"最小的質數是{}，最小的合數是{}。",["1", "2", "3", "4"],["2", "4"],"2 是最小的質數；4 = 2×2，是最小的合數。1 既不是質數也不是合數。");
fill(37,0,2,"30 的所有質因數是{}、{}、{}。（順序不限）（順序不限）",["2", "3", "5", "6", "10"],["2", "3", "5"],"30 = 2×3×5，所以質因數是 2、3、5。",true);
fill(37,1,2,"3/5 ÷ 6 = {}。",["1/10", "10", "2/5", "18/5"],["1/10"],"3/5 ÷ 6 = 3/(5×6) = 3/30 = 1/10。");
fill(37,1,1,"18 ÷ 0.6 = {}。",["3", "30", "0.3", "108"],["30"],"被除數、除數同乘 10：180 ÷ 6 = 30。");
fill(37,2,1,"把比 12：18 化成最簡整數比，是{}：{}。",["2", "3", "4", "6"],["2", "3"],"12 和 18 的最大公因數是 6，同除以 6 得 2：3。");
fill(37,2,2,"比 3：5 的前項是{}，後項是{}，比值是{}。",["3", "5", "3/5", "5/3"],["3", "5", "3/5"],"比的前項是 3，後項是 5；比值 = 3 ÷ 5 = 3/5。");
mc(37,3,1,"一條緞帶長 7.2 公尺，每 0.9 公尺剪成一段，可以剪成幾段？",["6", "7", "8", "9"],2,"7.2 ÷ 0.9 = 72 ÷ 9 = 8，可以剪成 8 段。");
mc(37,3,2,"有 24 顆糖、36 片餅乾，要分給小朋友，每人分到的糖和餅乾數量都相同、而且正好分完，最多可以分給幾位小朋友？",["6", "8", "12", "72"],2,"求 24 和 36 的最大公因數 = 12，最多分給 12 位小朋友。");
mc(37,3,2,"甲路公車每 12 分鐘發一班，乙路公車每 18 分鐘發一班。兩路公車同時發車後，至少再過幾分鐘又會同時發車？",["6", "30", "36", "216"],2,"求 12 和 18 的最小公倍數 = 36，所以至少再過 36 分鐘。");
mc(37,3,2,"有 3/4 公升的果汁，倒入杯子，每杯裝 3/16 公升，可以裝滿幾杯？",["2", "5", "3", "4"],3,"3/4 ÷ 3/16 = 3/4 × 16/3 = 4，可以裝滿 4 杯。");
mc(37,2,3,"果汁的調配比是原液：水 = 3：5。如果用了 15 毫升的原液，需要加多少毫升的水？",["9", "25", "15", "5"],1,"15 ÷ 3 = 5，每一份是 5 毫升，水是 5 份：5×5 = 25 毫升。");
mc(37,0,3,"有一個數除以 6、除以 8、除以 12，餘數都是 1，這個數最小是多少？",["24", "25", "49", "73"],1,"6、8、12 的最小公倍數是 24，所以最小的數是 24 + 1 = 25。");

/* ===== 第 38 單元：六年級社會 考古題題型 ===== */
tf(38,0,1,"廣告可能影響購買決定，所以購物前要先想清楚自己真正的需要。",true,"廣告的目的是吸引消費，聰明的消費者會先判斷需不需要，再比較價格與品質。");
tf(38,0,2,"投資的報酬率愈高，通常風險也愈大。",true,"想賺得多，往往也可能賠得多；投資前要先評估自己能承擔的風險。");
tf(38,2,2,"「三七五減租」是降低佃農繳給地主的租金，讓農民的收入增加。",true,"三七五減租規定租金不得超過農作物收成的 37.5%，減輕佃農負擔。");
tf(38,2,2,"加工出口區的設立，主要是為了鼓勵農業發展。",false,"加工出口區提供優惠，吸引外資與廠商進駐，把原料加工後出口，發展的是工業與出口貿易。");
tf(38,3,2,"十大建設包含中山高速公路和桃園國際機場。",true,"十大建設包括交通、重工業與能源建設，中山高速公路與桃園國際機場都在其中。");
mc(38,0,1,"下列哪一項是聰明消費的做法？",["看到打折就買", "先想清楚需要，再比較價格與品質", "同學有的東西就跟著買", "只看廣告決定要買什麼"],1,"聰明消費要先分辨「需要」和「想要」，再比較後購買。");
mc(38,0,1,"小美在超商用手機掃碼付款，這種付款方式稱為什麼？",["行動支付", "貨到付款", "分期付款", "易貨交易"],0,"用手機等行動裝置完成付款，稱為行動支付。");
mc(38,0,1,"網路購物時，下列哪一種做法比較安全？",["選擇有信譽的賣家並保留交易紀錄", "把密碼告訴客服", "點擊陌生人傳來的連結", "先匯款給私人帳戶"],0,"選擇可靠的賣家、保留紀錄，並且絕不透露密碼，才能避免詐騙。");
mc(38,0,1,"下列哪一項屬於「理財」的做法？",["把零用錢一次花光", "規劃收入與支出，並且養成儲蓄習慣", "借錢買想要的東西", "買很多用不到的商品"],1,"理財是規劃金錢的使用，包括儲蓄、保險與適度的投資。");
mc(38,1,1,"下列哪一項通常不是生產者在決定生產前會考慮的因素？",["成本", "技術", "市場需求", "消費者的星座"],3,"生產者會考慮成本、技術、市場需求與資源等，跟消費者的星座無關。");
mc(38,2,1,"政府推行「耕者有其田」，主要目的是什麼？",["讓農民擁有自己的土地，提高生產的意願", "把農地全部改建成工廠", "讓地主收取更高的租金", "鼓勵農民出國"],0,"耕者有其田讓佃農能買下耕作的土地，生產意願提高，農村生活也更穩定。");
mc(38,2,1,"臺灣在戰後得到美國提供的經濟援助，稱為什麼？",["美援", "國債", "稅金", "貸款"],0,"美援是美國在 1950 年代起提供的經濟與物資援助，幫助臺灣穩定經濟、發展建設。");
mc(38,2,2,"臺灣早期為了鼓勵出口、吸引外資，在高雄設立了第一個什麼？",["科學園區", "加工出口區", "國家公園", "工業博物館"],1,"1966 年在高雄設立加工出口區，帶動就業與出口。");
mc(38,3,1,"下列哪一項屬於十大建設中的交通建設？",["中山高速公路", "大煉鋼廠", "核能發電廠", "石油化學工業"],0,"中山高速公路、桃園國際機場、鐵路電氣化、北迴鐵路、臺中港、蘇澳港都是交通建設。");
mc(38,3,2,"新竹科學園區成立後，帶動了臺灣哪一種產業的發展？",["高科技（積體電路）產業", "傳統手工業", "漁業", "礦業"],0,"新竹科學園區聚集許多電子與半導體公司，使臺灣成為重要的高科技產業基地。");
fill(38,0,2,"投資的{}愈高，通常{}也愈大。",["報酬", "風險", "成本", "利息"],["報酬", "風險"],"報酬與風險通常成正比，投資前要先評估自己能承擔多少風險。");
fill(38,2,2,"政府推動土地改革，包括三七五{}、公地{}，以及耕者有其田。",["減租", "放領", "增稅", "徵收"],["減租", "放領"],"三七五減租、公地放領、耕者有其田，是臺灣土地改革的三個步驟。");
fill(38,2,2,"在高雄發展的重工業，包括煉鋼、{}和石化。",["造船", "紡織", "食品", "造紙"],["造船"],"高雄擁有港口與腹地，發展出煉鋼、造船與石化等重工業。");
fill(38,3,1,"十大建設中的{}高速公路，是縱貫臺灣南北的重要交通動脈。",["中山", "中正", "環島", "濱海"],["中山"],"中山高速公路（國道一號）通車後，大幅縮短南北往來時間。");
fill(38,3,2,"新竹{}園區於 1980 年成立，吸引許多高科技公司進駐。",["科學", "工業", "農業", "觀光"],["科學"],"新竹科學園區是臺灣第一座科學園區，是高科技產業發展的重要推手。");

/* ===== 第 39 單元：六年級自然 考古題題型 ===== */
tf(39,0,1,"大部分物質受熱後體積會變大，遇冷後體積會變小。",true,"這種性質叫作熱脹冷縮；氣體最明顯，液體次之，固體最不明顯。");
tf(39,1,1,"熱的傳播方式有傳導、對流和輻射三種。",true,"固體主要靠傳導，液體和氣體主要靠對流，太陽的熱則靠輻射傳到地球。");
tf(39,1,1,"把金屬湯匙放進熱湯裡，握柄會漸漸變熱，這是熱的傳導。",true,"熱沿著金屬由溫度高的一端傳到溫度低的一端，是傳導。");
tf(39,2,2,"天氣圖上，等壓線愈密集的地方，風勢愈弱。",false,"等壓線愈密集，表示氣壓差愈大，風就愈強。");
tf(39,3,2,"颱風中心的氣壓比四周高。",false,"颱風是熱帶低氣壓增強而成，中心氣壓比四周低。");
mc(39,0,1,"鐵軌的接縫處要留一點空隙，主要是為了避免什麼問題？",["夏天鐵軌受熱膨脹而彎曲變形", "冬天鐵軌變輕", "鐵軌生鏽", "火車速度變慢"],0,"鐵軌受熱會膨脹，沒有留縫隙會互相擠壓而彎曲，這是熱脹冷縮的應用。");
mc(39,0,2,"水結成冰之後，體積會怎麼變化？",["變小", "變大", "不變", "先變大再變小"],1,"水在 4°C 以下是熱縮冷脹，結冰後體積變大，所以冰會浮在水面。");
